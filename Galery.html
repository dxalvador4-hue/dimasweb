<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Galeri Media</title>
    <link rel="stylesheet" href="Style.css" />
    <style>
        /* Gaya tambahan khusus untuk Modal/Pop-up Foto */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9); 
            cursor: zoom-out;
            overflow: hidden;
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 85%;
            position: relative;
            top: 50%;
            transform: translateY(-50%);
            border: 4px solid white;
            border-radius: 5px;
            animation: zoomIn 0.3s;
        }

        @keyframes zoomIn {
            from {transform: translateY(-50%) scale(0)} 
            to {transform: translateY(-50%) scale(1)}
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Membuat kursor berubah jadi telunjuk saat arahkan ke foto galeri */
        .foto-container img {
            cursor: zoom-in;
        }
    </style>
</head>
<body>
    <nav>
        <b>MENU:</b>
        <a href="Index.html">Home</a> | <a href="Beranda.html">Beranda</a> | <a href="Profil.html">Profil</a> | <a href="Galery.html" class="active">Galeri</a> 
    </nav>

    <h1>Galeri Media</h1>

    <div class="card">
        <h3>Koleksi Foto:</h3>
        <div class="foto-container">
            <img src="Asset/Foto/foto1.png" alt="Foto 1" onclick="bukaModal(this.src)">
            <img src="Asset/Foto/foto.png" alt="Foto 2" onclick="bukaModal(this.src)">
        </div>
    </div>

    <div class="card">
        <h3>Dengarkan Musik:</h3>
        <audio controls><source src="Asset/Audio/Audio.mp3" type="audio/mpeg"></audio>
    </div>

    <div id="myModal" class="modal" onclick="tutupModal()">
        <span class="close">&times;</span>
        <img class="modal-content" id="imgFull">
    </div>

    <script>
        function bukaModal(src) {
            document.getElementById("myModal").style.display = "block";
            document.getElementById("imgFull").src = src;
        }

        function tutupModal() {
            document.getElementById("myModal").style.display = "none";
        }
        
        // Menutup dengan tombol 'Esc' di keyboard
        document.addEventListener('keydown', function(e) {
            if (e.key === "Escape") {
                tutupModal();
            }
        });
    </script>
</body>
</html>
